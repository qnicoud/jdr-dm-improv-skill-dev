[versions]
agp = "9.4.0"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
room3 = "3.0.3"
sqlite = "2.7.1"
datastore = "1.2.1"
serialization = "1.11.0"
coroutines = "1.11.0"
junit = "6.1.3"
